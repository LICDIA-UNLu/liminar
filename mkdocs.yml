site_name: Liminar
site_description: Modelos de lenguaje abiertos del sistema universitario argentino
site_url: https://licdia-unlu.github.io/liminar/
repo_url: https://github.com/LICDIA-UNLu/liminar
repo_name: LICDIA-UNLu/liminar
copyright: LICDIA - Universidad Nacional de Luján

theme:
  name: material
  language: es
  logo: assets/liminar-marca-oscuro.svg
  favicon: assets/liminar-icono-64.png
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Modo claro

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Inicio: index.md
  - Modelos: modelos.md
  - Uso: uso.md
  - Receta para universidades: receta.md
  - Cómo se hizo:
      - Corpus: corpus.md
      - Datos de entrenamiento: datos.md
      - Entrenamiento: entrenamiento.md
      - Evaluación: evaluacion.md
      - Cómputo: computo.md
